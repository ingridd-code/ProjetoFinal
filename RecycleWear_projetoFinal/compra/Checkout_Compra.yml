info:
  name: Checkout_Compra
  type: http

http:
  method: POST
  url: http://localhost:3000/api/compras/checkout
  body:
    type: json
    data: |-
      {
        "id_usuario": 1,
        "itens": [
          {
            "id_produto": 3,
            "quantidade": 2
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
