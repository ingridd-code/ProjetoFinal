info:
  name: Criar_Categoria
  type: http

http:
  method: POST
  url: http://localhost:3000/api/produtos/categorias
  body:
    type: json
    data: |-
      {
        "nome": "Acessórios Sustentáveis",
        "descricao": "Mochilas, bonés e ecobags feitos com material reciclado"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
