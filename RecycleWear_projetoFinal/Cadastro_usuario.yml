info:
  name: Cadastro_usuario
  type: http

http:
  method: POST
  url: http://localhost:3000/api/auth/register
  body:
    type: json
    data: |-
      {
        "nome": "Maria Silva",
        "email": "maria@email.com",
        "senha": "senha123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
